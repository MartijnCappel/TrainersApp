<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>SportApp</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#F5F4F0;--su:#fff;--s2:#EEECEA;--bo:rgba(0,0,0,.10);--b2:rgba(0,0,0,.18);
  --tx:#1A1A18;--t2:#6B6A66;--t3:#A0A09C;
  --ac:#2D5BE3;--abg:#EAF0FF;--atx:#1A3FA0;
  --gn:#1E7D4F;--gbg:#E6F5ED;--gtx:#14563A;
  --am:#B45309;--abg2:#FEF3E2;--atx2:#7C3D0A;
  --rd:#C0392B;--rbg:#FEE8E6;--rtx:#8B1F15;
  --pu:#6B3FA0;--pbg:#F0E8FF;--ptx:#4A2575;
  --tl:#0F766E;--tbg:#E6FAF8;--ttx:#0A5751;
  --r:12px;--rl:16px;--rx:20px;
  --fn:'DM Sans',sans-serif;
  --tab-h:64px;--topb-h:56px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:15px;overscroll-behavior:none;}
/* ── LAYOUT ─────────────────────────── */
.app{display:flex;flex-direction:column;height:100dvh;overflow:hidden;}
.topbar{height:var(--topb-h);flex-shrink:0;background:var(--su);border-bottom:1px solid var(--bo);display:flex;align-items:center;padding:0 16px;gap:10px;position:relative;z-index:10;}
.topbar-title{font-size:16px;font-weight:600;flex:1;letter-spacing:-.2px;}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;padding-bottom:calc(var(--tab-h) + var(--safe-b) + 16px);}
/* ── BOTTOM TAB BAR ──────────────────── */
.tabs{height:var(--tab-h);flex-shrink:0;background:var(--su);border-top:1px solid var(--bo);display:flex;align-items:stretch;padding-bottom:var(--safe-b);position:relative;z-index:10;}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;color:var(--t3);transition:color .15s;position:relative;padding:6px 4px;}
.tab-item.on{color:var(--ac);}
.tab-item i{font-size:22px;}
.tab-label{font-size:10px;font-weight:500;letter-spacing:.02em;}
.tab-badge{position:absolute;top:6px;right:calc(50% - 16px);background:var(--rd);color:#fff;font-size:9px;font-weight:700;padding:1px 5px;border-radius:10px;min-width:16px;text-align:center;}
/* ── HAMBURGER MENU ──────────────────── */
.ham-btn{width:40px;height:40px;border-radius:var(--r);background:none;border:none;display:flex;align-items:center;justify-content:center;color:var(--t2);font-size:22px;cursor:pointer;padding:0;}
.menu-overlay{display:none;position:fixed;inset:0;z-index:100;}
.menu-overlay.open{display:block;}
.menu-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.35);}
.menu-drawer{position:absolute;top:0;left:0;bottom:0;width:280px;background:var(--su);display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,.15);transform:translateX(-100%);transition:transform .25s ease;padding-top:var(--safe-b);}
.menu-overlay.open .menu-drawer{transform:none;}
.menu-head{padding:20px 16px 12px;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:12px;}
.menu-close{margin-left:auto;width:36px;height:36px;border-radius:var(--r);background:var(--s2);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);}
.menu-body{flex:1;overflow-y:auto;padding:8px;}
.menu-ni{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r);cursor:pointer;font-size:15px;color:var(--t2);margin:2px 0;}
.menu-ni:hover,.menu-ni:active{background:var(--s2);color:var(--tx);}
.menu-ni.on{background:var(--abg);color:var(--atx);font-weight:500;}
.menu-ni i{font-size:20px;flex-shrink:0;}
.menu-foot{padding:12px 8px;border-top:1px solid var(--bo);}
.role-section{background:var(--s2);border-radius:var(--r);padding:12px;}
.role-lbl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:8px;padding:0 4px;}
.rb{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:10px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--t2);font-family:var(--fn);margin:2px 0;text-align:left;}
.rb:active{background:rgba(0,0,0,.06);}
.rb.on{background:var(--su);color:var(--tx);font-weight:500;box-shadow:0 1px 4px rgba(0,0,0,.1);}
.rdot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
/* ── PILLS ───────────────────────────── */
.pl{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:500;}
.pl-bl{background:var(--abg);color:var(--atx);}
.pl-gn{background:var(--gbg);color:var(--gtx);}
.pl-am{background:var(--abg2);color:var(--atx2);}
.pl-rd{background:var(--rbg);color:var(--rtx);}
.pl-pu{background:var(--pbg);color:var(--ptx);}
.pl-tl{background:var(--tbg);color:var(--ttx);}
.pl-gy{background:var(--s2);color:var(--t2);}
.pl-or{background:#FEF0E0;color:#9A4B0D;}
.pl-go{background:#FFF8DC;color:#856404;}
/* ── CARDS ───────────────────────────── */
.card{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:14px 16px;margin-bottom:12px;}
.card-last{margin-bottom:0;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
.ct{font-size:14px;font-weight:600;}
.ca{font-size:13px;color:var(--ac);font-weight:500;}
/* ── METRICS ─────────────────────────── */
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.mc{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:14px 14px;}
.ml{font-size:11px;color:var(--t2);margin-bottom:6px;font-weight:500;}
.mv{font-size:24px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.ms{font-size:11px;color:var(--t3);margin-top:3px;}
/* ── ROWS ────────────────────────────── */
.row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--bo);}
.row:last-child{border-bottom:none;}
.row-tap{cursor:pointer;}
.row-tap:active{background:var(--s2);margin:0 -16px;padding:12px 16px;border-radius:var(--r);}
/* ── AVATAR ──────────────────────────── */
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.avsm{width:34px;height:34px;font-size:12px;}
.avmd{width:40px;height:40px;font-size:14px;}
.avlg{width:52px;height:52px;font-size:18px;}
/* ── BUTTONS ─────────────────────────── */
button{font-family:var(--fn);cursor:pointer;border-radius:var(--r);border:1px solid var(--b2);padding:10px 16px;font-size:14px;color:var(--t2);background:var(--su);transition:background .1s;-webkit-appearance:none;}
button:active{background:var(--s2);}
.bp{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500;}
.bp:active{background:#2451cc;}
.bd{background:var(--rbg);color:var(--rtx);border-color:transparent;}
.bg2{background:var(--gbg);color:var(--gtx);border-color:transparent;}
.bsm{padding:6px 12px;font-size:13px;}
.bi{width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;}
.btn-full{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;font-size:15px;font-weight:500;border-radius:var(--rl);}
/* ── FORMS ───────────────────────────── */
input,textarea,select{font-family:var(--fn);font-size:15px;background:var(--su);border:1px solid var(--b2);border-radius:var(--r);padding:12px 14px;color:var(--tx);width:100%;outline:none;-webkit-appearance:none;appearance:none;}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(45,91,227,.12);}
textarea{resize:none;min-height:80px;}
label{font-size:13px;font-weight:500;color:var(--t2);display:block;margin-bottom:6px;margin-top:14px;}
label:first-child{margin-top:0;}
.form-group{margin-bottom:2px;}
/* ── MODAL / SHEET ───────────────────── */
.sheet-overlay{display:none;position:fixed;inset:0;z-index:200;align-items:flex-end;}
.sheet-overlay.open{display:flex;}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.4);}
.sheet{position:relative;width:100%;max-height:92dvh;background:var(--su);border-radius:20px 20px 0 0;display:flex;flex-direction:column;animation:slideup .25s ease;}
@keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
.sheet-handle{width:36px;height:4px;border-radius:2px;background:var(--b2);margin:10px auto 0;}
.sheet-head{padding:16px 20px 12px;border-bottom:1px solid var(--bo);display:flex;align-items:center;justify-content:space-between;}
.sheet-title{font-size:17px;font-weight:600;}
.sheet-close{width:32px;height:32px;border-radius:50%;background:var(--s2);border:none;display:flex;align-items:center;justify-content:center;color:var(--t2);}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 20px;padding-bottom:calc(var(--safe-b) + 16px);}
.sheet-foot{padding:12px 20px;padding-bottom:calc(var(--safe-b) + 12px);border-top:1px solid var(--bo);display:flex;gap:10px;}
/* ── PROGRESS ────────────────────────── */
.pt{flex:1;height:7px;background:var(--s2);border-radius:4px;overflow:hidden;}
.pf{height:100%;border-radius:4px;}
/* ── CALENDAR ────────────────────────── */
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:14px;}
.dc{background:var(--su);border:1px solid var(--bo);border-radius:10px;overflow:hidden;}
.dh{padding:6px 4px;border-bottom:1px solid var(--bo);text-align:center;}
.dna{font-size:9px;font-weight:600;color:var(--t3);text-transform:uppercase;}
.dnu{font-size:14px;font-weight:600;}
.dc.tod .dh{background:var(--abg);}
.dc.tod .dnu{color:var(--ac);}
.dev{padding:4px;display:flex;flex-direction:column;gap:3px;min-height:44px;}
.ec{padding:3px 5px;border-radius:6px;font-size:9.5px;font-weight:600;cursor:pointer;line-height:1.3;}
.ec.rec{border-left:3px solid rgba(0,0,0,.2);}
/* ── CHAT ────────────────────────────── */
.chat-page{display:flex;flex-direction:column;height:100%;}
.chat-list-wrap{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.chat-thread{display:flex;flex-direction:column;height:calc(100dvh - var(--topb-h) - var(--tab-h) - var(--safe-b));}
.chat-messages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;display:flex;flex-direction:column;gap:10px;}
.msg{max-width:78%;}
.min{align-self:flex-start;}
.mout{align-self:flex-end;}
.mb2{padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.45;}
.min .mb2{background:var(--s2);color:var(--tx);border-radius:4px 16px 16px 16px;}
.mout .mb2{background:var(--ac);color:#fff;border-radius:16px 4px 16px 16px;}
.mm{font-size:11px;color:var(--t3);margin-top:4px;}
.mout .mm{text-align:right;}
.chat-input-bar{padding:10px 16px;padding-bottom:calc(var(--safe-b) + 10px);border-top:1px solid var(--bo);background:var(--su);display:flex;gap:8px;align-items:flex-end;}
.chat-input-bar textarea{flex:1;min-height:42px;max-height:100px;border-radius:20px;padding:10px 14px;font-size:15px;}
.chat-send{width:42px;height:42px;border-radius:50%;flex-shrink:0;}
/* ── LOG DOT ─────────────────────────── */
.ldt{width:10px;height:10px;border-radius:50%;margin-top:5px;flex-shrink:0;}
.le{padding:10px 0;border-bottom:1px solid var(--bo);display:flex;gap:12px;}
.le:last-child{border-bottom:none;}
/* ── TAGS ────────────────────────────── */
.tg{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:13px;background:var(--s2);color:var(--t2);border:1px solid var(--bo);}
.tg.act{background:var(--abg);color:var(--atx);border-color:var(--ac);}
.tg.clk{cursor:pointer;}
/* ── MULTI SELECT ────────────────────── */
.mswrap{position:relative;}
.msbox{border:1px solid var(--b2);border-radius:var(--r);padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;min-height:48px;cursor:pointer;background:var(--su);}
.msch{display:flex;align-items:center;gap:4px;background:var(--abg);color:var(--atx);border-radius:20px;padding:4px 10px;font-size:13px;font-weight:500;}
.msch button{width:18px;height:18px;padding:0;border:none;background:none;color:var(--atx);font-size:16px;cursor:pointer;}
.msdrop{position:absolute;top:100%;left:0;right:0;background:var(--su);border:1px solid var(--b2);border-radius:var(--r);box-shadow:0 8px 32px rgba(0,0,0,.15);z-index:300;max-height:200px;overflow-y:auto;display:none;margin-top:4px;}
.msdrop.open{display:block;}
.msopt{padding:12px 14px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bo);}
.msopt:last-child{border-bottom:none;}
.msopt.ch{color:var(--ac);font-weight:500;}
.msopt .chk{width:18px;height:18px;border:2px solid var(--b2);border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.msopt.ch .chk{background:var(--ac);border-color:var(--ac);}
/* ── NINE GRID ───────────────────────── */
.ng{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:240px;margin-top:8px;}
.nc{aspect-ratio:1;border:2px solid var(--b2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;cursor:pointer;color:var(--t3);background:var(--s2);}
.nc.sel{background:var(--ac);border-color:var(--ac);color:#fff;}
/* ── SPECIALIST CARD ─────────────────── */
.spcard{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:16px;margin-bottom:10px;display:flex;gap:14px;}
/* ── TRAINER BLOCK ───────────────────── */
.tbl{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;}
.thd{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;}
.thd:active{background:var(--s2);}
.sit{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--bo);}
/* ── UTILITY ─────────────────────────── */
.divider{height:1px;background:var(--bo);margin:12px 0;}
.section-title{font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:20px 0 10px;}
.empty{text-align:center;padding:48px 16px;color:var(--t3);}
.empty i{font-size:36px;margin-bottom:10px;display:block;}
::-webkit-scrollbar{width:0;height:0;}
</style>
</head>
<body>
<div class="app">
  <!-- TOP BAR -->
  <div class="topbar">
    <button class="ham-btn" onclick="openMenu()" aria-label="Menu"><i class="ti ti-menu-2"></i></button>
    <div class="topbar-title" id="pgtitle">Dashboard</div>
    <div style="display:flex;align-items:center;gap:6px">
      <div style="position:relative;cursor:pointer" onclick="toast('Geen nieuwe meldingen')">
        <i class="ti ti-bell" style="font-size:22px;color:var(--t2)"></i>
        <div id="ndt" style="position:absolute;top:0;right:0;width:8px;height:8px;border-radius:50%;background:var(--rd);border:1.5px solid var(--su)"></div>
      </div>
      <div class="av avsm" id="usrav" style="margin-left:4px"></div>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="con"></div>

  <!-- BOTTOM TABS -->
  <div class="tabs" id="tabs"></div>
</div>

<!-- SLIDE-OUT MENU -->
<div class="menu-overlay" id="menu-overlay" onclick="menuBgClose(event)">
  <div class="menu-backdrop"></div>
  <div class="menu-drawer">
    <div class="menu-head">
      <i class="ti ti-ball-football" style="font-size:24px;color:var(--ac)"></i>
      <span style="font-size:17px;font-weight:600">SportApp</span>
      <button class="menu-close" onclick="closeMenu()"><i class="ti ti-x" style="font-size:16px"></i></button>
    </div>
    <div class="menu-body" id="menu-body"></div>
    <div class="menu-foot">
      <div class="role-section">
        <div class="role-lbl">Aangemeld als</div>
        <button class="rb" onclick="setRole('coordinator')" id="rb-coordinator"><span class="rdot" style="background:#6B3FA0"></span>Coördinator</button>
        <button class="rb" onclick="setRole('trainer')" id="rb-trainer"><span class="rdot" style="background:#2D5BE3"></span>Trainer</button>
        <button class="rb" onclick="setRole('begeleider')" id="rb-begeleider"><span class="rdot" style="background:#0F766E"></span>Begeleider</button>
        <button class="rb" onclick="setRole('specialist')" id="rb-specialist"><span class="rdot" style="background:#B45309"></span>Specialist</button>
        <button class="rb" onclick="setRole('speler')" id="rb-speler"><span class="rdot" style="background:#1E7D4F"></span>Speler</button>
      </div>
    </div>
  </div>
</div>

<!-- BOTTOM SHEET -->
<div class="sheet-overlay" id="sheet" onclick="sheetBgClose(event)">
  <div class="sheet-backdrop"></div>
  <div class="sheet-inner" style="position:relative;width:100%;max-height:92dvh;background:var(--su);border-radius:20px 20px 0 0;display:flex;flex-direction:column;">
    <div class="sheet-handle"></div>
    <div class="sheet-head">
      <div class="sheet-title" id="sheet-title"></div>
      <button class="sheet-close" onclick="closeSheet()"><i class="ti ti-x" style="font-size:16px"></i></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
    <div class="sheet-foot" id="sheet-foot"></div>
  </div>
</div>

<div class="toast" id="toast" style="position:fixed;bottom:calc(var(--tab-h) + var(--safe-b) + 12px);left:50%;transform:translateX(-50%);background:#1A1A18;color:#F5F4F0;font-size:13px;font-weight:500;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;white-space:nowrap;"></div>

<script>
// ── CONSTANTS ──────────────────────────
const POSITIES=['Linkerhoek','Linkeropbouw','Midopbouw','Rechteropbouw','Rechterhoek','Cirkel','Keeper'];
const LIDSOORTEN=['Basis','Kracht','Fysio','Kracht + Fysio','Selectie'];

const TRTYPES=['conditie','kracht','tactiek','herstel','positie','wedstrijd'];
const TCLR={conditie:'bl',kracht:'pu',tactiek:'tl',herstel:'gn',positie:'or',wedstrijd:'am'};
const AVC=[{bg:'#EAF0FF',tx:'#1A3FA0'},{bg:'#E6FAF8',tx:'#0A5751'},{bg:'#F0E8FF',tx:'#4A2575'},{bg:'#FEE8E6',tx:'#8B1F15'},{bg:'#E6F5ED',tx:'#14563A'},{bg:'#FEF3E2',tx:'#7C3D0A'},{bg:'#F5F4F0',tx:'#5F5E5A'}];

// ── DATA ───────────────────────────────
const D={
  trainers:[
    {id:1,name:'Marc Vos',spec:'Hoofdtrainer',avBg:'#EAF0FF',avTx:'#1A3FA0'},
    {id:2,name:'Inge de Boer',spec:'Krachtrainer',avBg:'#E6FAF8',avTx:'#0A5751'},
    {id:3,name:'Remi Smits',spec:'Assistent-trainer',avBg:'#F0E8FF',avTx:'#4A2575'},
  ],
  begeleiders:[
    {id:20,name:'Joost Bakker',rol:'Teammanager'},
    {id:21,name:'Petra van Dam',rol:'Assistent'},
  ],
  specialisten:[
    {id:10,name:'Dr. P. Silva',rol:'Fysiotherapeut',taak:'Revalidatie en blessurepreventie.',avBg:'#FEE8E6',avTx:'#8B1F15',email:'silva@sportapp.nl',tel:'06-12345678'},
    {id:11,name:'Anne Mulder',rol:'Voedingsdeskundige',taak:'Voedingsplannen en hydratatieschemas.',avBg:'#E6F5ED',avTx:'#14563A',email:'mulder@sportapp.nl',tel:'06-87654321'},
    {id:12,name:'Kai Hendriks',rol:'Sportpsycholoog',taak:'Mentale begeleiding en prestatiepsychologie.',avBg:'#FEF3E2',avTx:'#7C3D0A',email:'hendriks@sportapp.nl',tel:'06-11223344'},
  ],

const visSp=()=>{
  const u=RUSERS[role];
  if(role==='coordinator')return D.spelers;
  if(role==='trainer')return D.spelers.filter(s=>(s.trainerIds||[]).includes(u.id));
  if(role==='begeleider')return D.spelers.filter(s=>(s.begeleiderIds||[]).includes(u.id));
  if(role==='specialist')return D.spelers.filter(s=>(s.specialistIds||[]).includes(u.id));
  if(role==='speler')return D.spelers.filter(s=>s.id===u.spelerId);
  return D.spelers;
};

const weekDays=off=>{
  const now=new Date('2026-06-04');const dow=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-(dow===0?6:dow-1)+off*7);
  return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;});
};
const fmtDS=d=>d.toISOString().slice(0,10);

const weekT=days=>{
  const res=[];
  D.trainingen.forEach(t=>{
    days.forEach(wd=>{
      const ds=fmtDS(wd);
      if(t.datum===ds){res.push({...t});}
      else if(t.herhalend){
        const diff=Math.round((wd-new Date(t.datum))/86400000);
        const ok=(t.herhaling==='wekelijks'&&diff>0&&diff%7===0)||(t.herhaling==='tweewekelijks'&&diff>0&&diff%14===0);
        if(ok)res.push({...t,datum:ds,isInst:true});
      }
    });
  });
  return res;
};

function renderCalWeek(days,today,trainingen){
  const dayNames=['Ma','Di','Wo','Do','Vr','Za','Zo'];
  return days.map((day,i)=>{
    const ds=fmtDS(day);
    const evts=trainingen.filter(t=>t.datum===ds);
    return`<div class="dc${ds===today?' tod':''}">
      <div class="dh"><div class="dna">${dayNames[i]}</div><div class="dnu">${day.getDate()}</div></div>
      <div class="dev">${evts.map(e=>`<div class="ec pl-${TCLR[e.type]||'gy'}${e.isInst?' rec':''}" onclick="openTraining(${e.id})">
        <div>${e.tijd.split(':')[0]}u</div>
        <div style="font-size:8.5px;margin-top:1px;font-weight:600">${e.naam.split(' ')[0]}</div>
      </div>`).join('')}</div>

const MS={};
function msWidget(id,items,sel,lk){
  const selected=new Set((sel||[]).map(Number));MS[id]={items,sel:selected,lk};
  const chips=[...selected].map(sid=>{const it=items.find(x=>x.id===sid);return it?`<span class="msch">${it[lk]}<button type="button" onclick="event.stopPropagation();msRm('${id}',${sid})">&times;</button></span>`:''}).join('');
  const opts=items.map(it=>`<div class="msopt${selected.has(it.id)?' ch':''}" onclick="msTog('${id}',${it.id})"><span class="chk">${selected.has(it.id)?'<i class="ti ti-check" style="font-size:10px;color:#fff"></i>':''}</span>${it[lk]}</div>`).join('');
  return`<div class="mswrap"><div class="msbox" onclick="msOpen('${id}')"><span id="ms-chips-${id}" style="display:contents">${chips}</span><span id="ms-ph-${id}" style="font-size:14px;color:var(--t3)"${selected.size?' hidden':''}>Klik om te selecteren…</span></div><div class="msdrop" id="ms-drop-${id}">${opts}</div><input type="hidden" id="ms-hv-${id}" value="${[...selected].join(',')}"></div>`;
}
function msTog(id,itemId){const s=MS[id];if(!s)return;s.sel.has(itemId)?s.sel.delete(itemId):s.sel.add(itemId);msRender(id);}
function msRm(id,itemId){const s=MS[id];if(!s)return;s.sel.delete(itemId);msRender(id);}
function msOpen(id){document.querySelectorAll('.msdrop.open').forEach(d=>{if(d.id!=='ms-drop-'+id)d.classList.remove('open');});document.getElementById('ms-drop-'+id)?.classList.toggle('open');}
function msRender(id){const s=MS[id];if(!s)return;const chips=document.getElementById('ms-chips-'+id);if(chips)chips.innerHTML=[...s.sel].map(sid=>{const it=s.items.find(x=>x.id===sid);return it?`<span class="msch">${it[s.lk]}<button type="button" onclick="event.stopPropagation();msRm('${id}',${sid})">&times;</button></span>`:''}).join('');const ph=document.getElementById('ms-ph-'+id);if(ph)ph.style.display=s.sel.size?'none':'inline';const hv=document.getElementById('ms-hv-'+id);if(hv)hv.value=[...s.sel].join(',');const drop=document.getElementById('ms-drop-'+id);if(drop)drop.innerHTML=s.items.map(it=>`<div class="msopt${s.sel.has(it.id)?' ch':''}" onclick="msTog('${id}',${it.id})"><span class="chk">${s.sel.has(it.id)?'<i class="ti ti-check" style="font-size:10px;color:#fff"></i>':''}</span>${it[s.lk]}</div>`).join('');}
function msGet(id){const hv=document.getElementById('ms-hv-'+id);return hv?hv.value.split(',').map(Number).filter(Boolean):[];}
document.addEventListener('click',e=>{if(!e.target.closest('.mswrap'))document.querySelectorAll('.msdrop.open').forEach(d=>d.classList.remove('open'));});

const togRep=()=>{document.getElementById('reprow').style.display=document.getElementById('mrep').checked?'block':'none';};

function togRecip(row){
  const chk=row.querySelector('div');
  const isOn=chk.innerHTML.includes('ti-check');
  if(isOn){chk.style.background='transparent';chk.style.borderColor='var(--b2)';chk.innerHTML='';row.style.opacity='0.4';}
  else{chk.style.background='var(--ac)';chk.style.borderColor='var(--ac)';chk.innerHTML='<i class="ti ti-check" style="font-size:12px;color:#fff"></i>';row.style.opacity='1';}
}
function selectAll(cat){document.querySelectorAll('.recip-row').forEach(row=>{if(cat==='all'||cat==='none'||row.dataset.cat===cat){const chk=row.querySelector('div');const on=(cat!=='none');chk.style.background=on?'var(--ac)':'transparent';chk.style.borderColor=on?'var(--ac)':'var(--b2)';chk.innerHTML=on?'<i class="ti ti-check" style="font-size:12px;color:#fff"></i>':'';row.style.opacity=on?'1':'0.4';}});}
function getSelRecips(){const sel=[];document.querySelectorAll('.recip-row').forEach(row=>{if(row.querySelector('div')?.innerHTML.includes('ti-check'))sel.push({id:parseInt(row.dataset.id),cat:row.dataset.cat});});return sel;}

function verzendBericht(trainingId){
  const tekst=document.getElementById('mtekst2')?.value.trim();if(!tekst){toast('Typ eerst een bericht');return;}
  const sel=getSelRecips();if(!sel.length){toast('Selecteer minstens één ontvanger');return;}
  sel.forEach(r=>{const key=r.id;if(!chatMsgs[key])chatMsgs[key]=[];chatMsgs[key].push({van:RUSERS[role].name,r:'uit',tekst:tekst,tijd:'nu'});});
  toast(`Bericht verstuurd naar ${sel.length} ${sel.length===1?'persoon':'personen'}!`);
  closeSheet();renderTabs();
}

const sheetBgClose=e=>{if(e.target.classList.contains('sheet-backdrop')||e.target===document.getElementById('sheet'))closeSheet();};
const closeSheet=()=>document.getElementById('sheet').classList.remove('open');

function submitSheet(){
  const mode=sheetMode,meta=sheetMeta;
  if(mode==='speler-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul een naam in');return;}
    D.spelers.push({id:nid(D.spelers),name,woonplaats:document.getElementById('mw').value,geboortedatum:document.getElementById('md2').value,lidsoort:document.getElementById('mls').value,posities:posGet(),nineGrid:ngGet(),trainerIds:msGet('mtr'),begeleiderIds:msGet('mbg'),specialistIds:msGet('msp'),status:'actief',doelen:0,aanwezig:100,blessure:null});
    toast(name+' toegevoegd');
  }else if(mode==='speler-edit'){
    const s=D.spelers.find(p=>p.id===meta.id);if(!s)return;
    s.name=document.getElementById('mn').value.trim()||s.name;s.woonplaats=document.getElementById('mw').value;s.geboortedatum=document.getElementById('md2').value;
    s.lidsoort=document.getElementById('mls').value;s.posities=posGet();s.nineGrid=ngGet();
    s.trainerIds=msGet('mtr');s.begeleiderIds=msGet('mbg');s.specialistIds=msGet('msp');
    s.status=document.getElementById('mst').value;s.blessure=document.getElementById('mbl').value||null;
    toast(s.name+' opgeslagen');
  }else if(mode==='training-add'){
    const naam=document.getElementById('mnm').value.trim();if(!naam){toast('Vul een naam in');return;}
    const rep=document.getElementById('mrep').checked;
    D.trainingen.push({id:nid(D.trainingen),naam,type:document.getElementById('mty').value,datum:document.getElementById('mdt').value,tijd:document.getElementById('mtj').value,duur:parseInt(document.getElementById('mdr').value)||90,trainerIds:msGet('mtr2'),spelerIds:msGet('msp2'),notities:document.getElementById('mno').value,herhalend:rep,herhaling:rep?document.getElementById('mfrq').value:null});
    toast('Training gepland');
  }else if(mode==='training-edit'){
    const t=D.trainingen.find(x=>x.id===meta.id);if(!t)return;
    const rep=document.getElementById('mrep').checked;
    t.naam=document.getElementById('mnm').value.trim()||t.naam;t.type=document.getElementById('mty').value;t.datum=document.getElementById('mdt').value;t.tijd=document.getElementById('mtj').value;t.duur=parseInt(document.getElementById('mdr').value)||t.duur;t.notities=document.getElementById('mno').value;
    t.herhalend=rep;t.herhaling=rep?document.getElementById('mfrq').value:null;t.trainerIds=msGet('mtr2');t.spelerIds=msGet('msp2');
    toast('Training opgeslagen');
  }else if(mode==='log-add'||mode==='log-add-speler'){
    const titel=document.getElementById('mtit').value.trim();if(!titel){toast('Vul een titel in');return;}
    D.logs.unshift({id:nid(D.logs),speler:parseInt(document.getElementById('mspl').value),datum:'2026-06-04',type:document.getElementById('mtyp').value,titel,nota:document.getElementById('mnot').value,auteur:RUSERS[role].name});
    toast('Log entry opgeslagen');
  }else if(mode==='trainer-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    const c=avc(name);D.trainers.push({id:nid(D.trainers),name,spec:document.getElementById('mspec').value,avBg:c.bg,avTx:c.tx});toast(name+' toegevoegd');
  }else if(mode==='begel-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    D.begeleiders.push({id:nid(D.begeleiders),name,rol:document.getElementById('mrol').value});toast(name+' toegevoegd');
  }else if(mode==='spec-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    const c=avc(name);D.specialisten.push({id:nid(D.specialisten),name,rol:document.getElementById('mrol2').value,taak:document.getElementById('mtaak').value,email:document.getElementById('memail').value,tel:document.getElementById('mtel').value,avBg:c.bg,avTx:c.tx});toast(name+' toegevoegd');
  }else if(mode==='nieuw-bericht'||mode==='vraag-stellen'){
    const tekst=document.getElementById('mtekst')?.value.trim();if(!tekst){toast('Typ een bericht');return;}
    toast('Bericht verstuurd!');
  }
  closeSheet();renderPage();renderTabs();
}

// ── INIT ───────────────────────────────
setRole('trainer');
</script>
