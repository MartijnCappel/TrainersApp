<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportApp</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
:root{--bg:#F5F4F0;--su:#fff;--s2:#EEECEA;--bo:rgba(0,0,0,.10);--b2:rgba(0,0,0,.18);--tx:#1A1A18;--t2:#6B6A66;--t3:#A0A09C;--ac:#2D5BE3;--abg:#EAF0FF;--atx:#1A3FA0;--gn:#1E7D4F;--gbg:#E6F5ED;--gtx:#14563A;--am:#B45309;--abg2:#FEF3E2;--atx2:#7C3D0A;--rd:#C0392B;--rbg:#FEE8E6;--rtx:#8B1F15;--pu:#6B3FA0;--pbg:#F0E8FF;--ptx:#4A2575;--tl:#0F766E;--tbg:#E6FAF8;--ttx:#0A5751;--r:10px;--rl:14px;--rx:20px;--sw:220px;--th:56px;--fn:'DM Sans',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--fn);background:var(--bg);color:var(--tx);font-size:14px;}
.app{display:flex;height:100vh;overflow:hidden;}
.sb{width:var(--sw);flex-shrink:0;background:var(--su);border-right:1px solid var(--bo);display:flex;flex-direction:column;}
.sbl{padding:0 16px;height:var(--th);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--bo);font-size:16px;font-weight:600;letter-spacing:-.3px;}
.sbl i{color:var(--ac);font-size:22px;}
.sbn{flex:1;overflow-y:auto;padding:10px 8px;}
.ni{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13.5px;color:var(--t2);transition:background .12s,color .12s;margin:1px 0;}
.ni:hover{background:var(--s2);color:var(--tx);}
.ni.on{background:var(--abg);color:var(--atx);font-weight:500;}
.ni i{font-size:17px;flex-shrink:0;}
.nbg{margin-left:auto;background:var(--rd);color:#fff;font-size:10px;font-weight:600;padding:1px 6px;border-radius:20px;}
.sbf{padding:12px 8px;border-top:1px solid var(--bo);}
.rs{background:var(--s2);border-radius:var(--r);padding:8px;}
.rsl{font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;font-weight:600;padding:0 4px;}
.rb{display:flex;align-items:center;gap:7px;width:100%;padding:6px 8px;border-radius:7px;background:none;border:none;cursor:pointer;font-size:12.5px;color:var(--t2);font-family:var(--fn);transition:background .1s;margin:1px 0;}
.rb:hover{background:rgba(0,0,0,.05);}
.rb.on{background:var(--su);color:var(--tx);font-weight:500;box-shadow:0 1px 3px rgba(0,0,0,.08);}
.rdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.mn{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.topb{height:var(--th);flex-shrink:0;background:var(--su);border-bottom:1px solid var(--bo);display:flex;align-items:center;padding:0 24px;gap:12px;}
.ttl{font-size:15px;font-weight:600;flex:1;letter-spacing:-.2px;}
.ibt{width:34px;height:34px;border-radius:var(--r);background:var(--s2);border:1px solid var(--bo);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);position:relative;}
.ndt{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--rd);border:1.5px solid var(--su);}
.avt{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;}
.con{flex:1;overflow-y:auto;padding:24px;}
.pl{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:20px;font-size:11.5px;font-weight:500;}
.pl-bl{background:var(--abg);color:var(--atx);}
.pl-gn{background:var(--gbg);color:var(--gtx);}
.pl-am{background:var(--abg2);color:var(--atx2);}
.pl-rd{background:var(--rbg);color:var(--rtx);}
.pl-pu{background:var(--pbg);color:var(--ptx);}
.pl-tl{background:var(--tbg);color:var(--ttx);}
.pl-gy{background:var(--s2);color:var(--t2);}
.pl-or{background:#FEF0E0;color:#9A4B0D;}
.pl-go{background:#FFF8DC;color:#856404;}
.card{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:18px 20px;}
.csm{padding:12px 14px;}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.ct{font-size:13.5px;font-weight:600;}
.ca{font-size:12px;color:var(--ac);cursor:pointer;font-weight:500;}
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:20px;}
.mc{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:14px 16px;}
.ml{font-size:11.5px;color:var(--t2);margin-bottom:6px;font-weight:500;}
.mv{font-size:26px;font-weight:600;letter-spacing:-.5px;line-height:1;}
.ms{font-size:11px;color:var(--t3);margin-top:4px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px;}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0;}
.avsm{width:30px;height:30px;font-size:11px;}
.avmd{width:36px;height:36px;font-size:13px;}
.avlg{width:44px;height:44px;font-size:16px;}
.row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--bo);}
.row:last-child{border-bottom:none;}
.pt{flex:1;height:6px;background:var(--s2);border-radius:3px;overflow:hidden;}
.pf{height:100%;border-radius:3px;transition:width .4s;}
button{font-family:var(--fn);cursor:pointer;border-radius:var(--r);border:1px solid var(--b2);padding:7px 14px;font-size:13px;color:var(--t2);background:var(--su);transition:background .1s,color .1s;}
button:hover{background:var(--s2);color:var(--tx);}
.bp{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:500;}
.bp:hover{background:#2451cc;color:#fff;}
.bd{background:var(--rbg);color:var(--rtx);border-color:transparent;}
.bd:hover{background:#f9d0cc;}
.bg{background:var(--gbg);color:var(--gtx);border-color:transparent;}
.bg:hover{background:#cce8d8;}
.bsm{padding:4px 10px;font-size:12px;}
.bi{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;}
input,textarea,select{font-family:var(--fn);font-size:13px;background:var(--su);border:1px solid var(--b2);border-radius:var(--r);padding:8px 12px;color:var(--tx);width:100%;outline:none;transition:border .15s;}
input:focus,textarea:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px rgba(45,91,227,.12);}
textarea{resize:vertical;min-height:70px;}
label{font-size:12px;font-weight:500;color:var(--t2);display:block;margin-bottom:5px;margin-top:12px;}
label:first-child{margin-top:0;}
.mo{display:none;position:fixed;inset:0;background:rgba(0,0,0,.40);z-index:1000;align-items:center;justify-content:center;}
.mo.open{display:flex;}
.md{background:var(--su);border-radius:var(--rx);padding:24px;width:580px;max-width:95vw;max-height:90vh;overflow-y:auto;border:1px solid var(--bo);box-shadow:0 20px 60px rgba(0,0,0,.15);animation:mi .18s ease;}
@keyframes mi{from{transform:scale(.95) translateY(8px);opacity:0;}to{transform:none;opacity:1;}}
.mdtl{font-size:16px;font-weight:600;margin-bottom:16px;}
.mdac{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1A1A18;color:#F5F4F0;font-size:13px;font-weight:500;padding:10px 20px;border-radius:30px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:9999;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px);}
.chl{display:grid;grid-template-columns:260px 1fr;height:calc(100vh - var(--th) - 48px);}
.csb{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;}
.clist{flex:1;overflow-y:auto;}
.ci{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;border-bottom:1px solid var(--bo);transition:background .1s;}
.ci:hover{background:var(--s2);}
.ci.on{background:var(--abg);}
.cmn{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);overflow:hidden;display:flex;flex-direction:column;margin-left:12px;}
.chd{padding:14px 18px;border-bottom:1px solid var(--bo);display:flex;align-items:center;gap:12px;}
.cmsg{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;}
.msg{max-width:72%;}
.min{align-self:flex-start;}
.mout{align-self:flex-end;}
.mb2{padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.5;}
.min .mb2{background:var(--s2);color:var(--tx);border-radius:4px 14px 14px 14px;}
.mout .mb2{background:var(--ac);color:#fff;border-radius:14px 4px 14px 14px;}
.mm{font-size:10.5px;color:var(--t3);margin-top:4px;}
.mout .mm{text-align:right;}
.cinp{padding:14px 16px;border-top:1px solid var(--bo);display:flex;gap:8px;align-items:flex-end;}
.cinp textarea{min-height:40px;max-height:120px;flex:1;}
/* Week calendar */
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:16px;}
.dc{background:var(--su);border:1px solid var(--bo);border-radius:var(--r);overflow:hidden;}
.dh{padding:7px 8px;border-bottom:1px solid var(--bo);text-align:center;}
.dna{font-size:10px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;}
.dnu{font-size:15px;font-weight:600;}
.dc.tod .dh{background:var(--abg);}
.dc.tod .dnu{color:var(--ac);}
.dev{padding:5px;display:flex;flex-direction:column;gap:3px;min-height:55px;}
.ec{padding:4px 7px;border-radius:6px;font-size:10.5px;font-weight:500;cursor:pointer;}
.ec.rec{border-left:3px solid rgba(0,0,0,.22);}
/* nav controls */
.wnav{display:flex;align-items:center;gap:8px;}
/* trainer blocks */
.tbl{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);margin-bottom:10px;overflow:hidden;}
.thd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;}
.thd:hover{background:var(--s2);}
.sit{display:flex;align-items:center;gap:8px;padding:7px 14px;border-top:1px solid var(--bo);}
.sit:hover{background:var(--s2);}
.sac{margin-left:auto;display:flex;gap:4px;opacity:0;transition:opacity .1s;}
.sit:hover .sac{opacity:1;}
.le{padding:10px 0;border-bottom:1px solid var(--bo);display:flex;gap:12px;}
.le:last-child{border-bottom:none;}
.ldt{width:10px;height:10px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.emp{text-align:center;padding:48px 0;color:var(--t3);}
.emp i{font-size:32px;margin-bottom:10px;display:block;}
.ng{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:200px;margin-top:6px;}
.nc{aspect-ratio:1;border:2px solid var(--b2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;cursor:pointer;color:var(--t3);background:var(--s2);transition:all .15s;}
.nc.sel{background:var(--ac);border-color:var(--ac);color:#fff;}
.nc:hover:not(.sel){background:var(--abg);border-color:var(--ac);color:var(--ac);}
.tg{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;background:var(--s2);color:var(--t2);border:1px solid var(--bo);}
.tg.act{background:var(--abg);color:var(--atx);border-color:var(--ac);}
.tg.clk{cursor:pointer;}
.tg.clk:hover{border-color:var(--ac);color:var(--ac);}
/* multi-select */
.mswrap{position:relative;}
.msbox{border:1px solid var(--b2);border-radius:var(--r);padding:6px 8px;display:flex;flex-wrap:wrap;gap:5px;min-height:40px;cursor:pointer;background:var(--su);}
.msch{display:flex;align-items:center;gap:4px;background:var(--abg);color:var(--atx);border-radius:20px;padding:3px 8px;font-size:12px;font-weight:500;}
.msch button{width:16px;height:16px;padding:0;border:none;background:none;color:var(--atx);font-size:14px;line-height:1;cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.msch button:hover{background:rgba(45,91,227,.2);}
.msdrop{position:absolute;top:100%;left:0;right:0;background:var(--su);border:1px solid var(--b2);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.12);z-index:200;max-height:180px;overflow-y:auto;display:none;margin-top:2px;}
.msdrop.open{display:block;}
.msopt{padding:9px 12px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:8px;}
.msopt:hover{background:var(--s2);}
.msopt.ch{color:var(--ac);font-weight:500;}
.msopt .chk{width:16px;height:16px;border:2px solid var(--b2);border-radius:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.msopt.ch .chk{background:var(--ac);border-color:var(--ac);}
.spcard{background:var(--su);border:1px solid var(--bo);border-radius:var(--rl);padding:16px 18px;display:flex;gap:14px;align-items:flex-start;}
.pr{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--bo);}
.pr:last-child{border-bottom:none;}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tab-bar{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--bo);padding-bottom:0;}
.tab{padding:8px 14px;cursor:pointer;font-size:13px;color:var(--t2);border-bottom:2px solid transparent;margin-bottom:-1px;transition:color .15s,border-color .15s;}
.tab:hover{color:var(--tx);}
.tab.on{color:var(--ac);border-bottom-color:var(--ac);font-weight:500;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:4px;}
</style>
</head>

  <div class="con" id="con"></div>

</div>

</div>
<div class="toast" id="toast"></div>

function getWeekDates(offsetWeeks){
  // Start from Monday of current week + offset
  const now=new Date('2026-06-04'); // simulated "today" = Thursday Jun 4
  const dayOfWeek=now.getDay();
  const diff=now.getDate()-(dayOfWeek===0?6:dayOfWeek-1);
  const monday=new Date(now);monday.setDate(diff+offsetWeeks*7);
  const days=[];
  for(let i=0;i<7;i++){const d=new Date(monday);d.setDate(monday.getDate()+i);days.push(d);}
  return days;
}

      else if(t.herhalend){
        const diff=Math.round((wd-new Date(t.datum))/86400000);
        const ok=(t.herhaling==='wekelijks'&&diff>0&&diff%7===0)||(t.herhaling==='tweewekelijks'&&diff>0&&diff%14===0);
        if(ok)res.push({...t,datum:wds,isInst:true});
      }
    });
  });
  return res;
};

const MS={};

  const begeleiders=(s.begeleiderIds||[]).map(id=>byId(D.begeleiders,id)).filter(Boolean);

  <div class="g2" style="margin-bottom:0">
    <div class="card" style="margin-bottom:0"><div class="ch"><span class="ct">Mijn begeleiding</span></div>
      ${trainers.map(t=>`<div class="row">${av(t.name,'avsm',t.avBg,t.avTx)}<div style="flex:1"><div style="font-size:13px;font-weight:500">${t.name}</div><div style="font-size:11px;color:var(--t3)">${t.spec}</div></div>${pl('Trainer','bl')}</div>`).join('')}
      ${begeleiders.map(b=>`<div class="row">${av(b.name,'avsm')}<div style="flex:1"><div style="font-size:13px;font-weight:500">${b.name}</div><div style="font-size:11px;color:var(--t3)">${b.rol}</div></div>${pl('Begeleider','tl')}</div>`).join('')}
      ${specs.map(sp=>`<div class="row">${av(sp.name,'avsm',sp.avBg,sp.avTx)}<div style="flex:1"><div style="font-size:13px;font-weight:500">${sp.name}</div><div style="font-size:11px;color:var(--t3)">${sp.rol}</div></div>${pl('Specialist','am')}</div>`).join('')}
    </div>
    <div class="card" style="margin-bottom:0"><div class="ch"><span class="ct">Vraag stellen</span></div>
      <label>Aan</label>
      <select>${[...trainers.map(t=>t.name+' (trainer)'),...begeleiders.map(b=>b.name+' (begeleider)'),...specs.map(sp=>sp.name+' (specialist)')].map(x=>`<option>${x}</option>`).join('')}</select>
      <label style="margin-top:8px">Bericht</label><textarea placeholder="Typ je vraag…"></textarea>
      <div style="margin-top:10px"><button class="bp" onclick="toast('Bericht verstuurd!')"><i class="ti ti-send" style="margin-right:5px;font-size:13px"></i>Versturen</button></div>
    </div>
  </div>`;
}

      <label>Specialist(en)</label>${msWidget('msp',D.specialisten,s.specialistIds||[],'name')}
      <label>Status</label><select id="mst"><option value="actief"${s.status==='actief'?' selected':''}>Actief</option><option value="aandacht"${s.status==='aandacht'?' selected':''}>Aandacht nodig</option><option value="geblesseerd"${s.status==='geblesseerd'?' selected':''}>Geblesseerd</option></select>
      <label>Blessure-omschrijving</label><input type="text" id="mbl" value="${s.blessure||''}" placeholder="Bijv. Knieblessure week 2 van 4">`;
  }
  else if(mode==='speler-detail'){
    const s=D.spelers.find(p=>p.id===meta.id);
    const trainers=(s.trainerIds||[]).map(id=>byId(D.trainers,id)).filter(Boolean);
    const begeleiders=(s.begeleiderIds||[]).map(id=>byId(D.begeleiders,id)).filter(Boolean);

      </div>
      ${s.blessure?`<div style="background:var(--rbg);color:var(--rtx);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:12px"><i class="ti ti-alert-triangle" style="margin-right:5px"></i>${s.blessure}</div>`:''}
      <div style="margin-bottom:12px"><div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px">Posities</div>

      ${specs.map(sp=>`<div class="row">${av(sp.name,'avsm',sp.avBg,sp.avTx)}<div style="flex:1"><span style="font-size:13px;font-weight:500">${sp.name}</span><div style="font-size:11px;color:var(--t3)">${sp.rol}</div></div>${pl('Specialist','am')}</div>`).join('')}
      ${canSeeSchema&&mijnTrainingen.length?`<div style="font-size:12px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 8px">Schema (komende trainingen)</div>
        ${mijnTrainingen.map(t=>`<div class="row"><span class="pl pl-${TCLR[t.type]||'gy'}">${t.type}</span><div style="flex:1"><span style="font-size:13px;font-weight:500">${t.naam}</span><div style="font-size:11px;color:var(--t3)">${fmtD(t.datum)} · ${t.tijd}</div></div></div>`).join('')}`:''}

  else if(mode==='spec-add'||mode==='spec-edit'){

      <label>Spelers</label>${msWidget('msp2',D.spelers,t?t.spelerIds:[],'name')}`;

  else if(mode==='training-detail'){
    const t=D.trainingen.find(x=>x.id===meta.id);if(!t){ov.classList.add('open');return;}
    const tnames=(t.trainerIds||[]).map(id=>{const tr=byId(D.trainers,id);return tr?tr.name:''}).filter(Boolean);

        ${trainerRecips.map(p=>`<div class="recip-row" data-id="${p.id}" data-cat="trainer" onclick="togRecip(this)" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bo);background:var(--su);transition:background .1s">
          <div style="width:18px;height:18px;border-radius:5px;border:2px solid var(--ac);background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-check" style="font-size:11px;color:#fff"></i></div>
          ${av(p.name,'avsm',p.avBg,p.avTx)}
          <div style="flex:1"><div style="font-size:13px;font-weight:500">${p.name}</div><div style="font-size:11px;color:var(--t3)">${p.spec||''}</div></div>
          ${pl('Trainer','bl')}
        </div>`).join('')}
        <div style="padding:6px 10px;background:var(--s2);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--bo);border-top:1px solid var(--bo)">
          <span style="font-size:11px;font-weight:600;color:var(--t3);text-transform:uppercase;letter-spacing:.05em">Spelers</span>
          <button class="bsm" style="font-size:11px;padding:2px 8px" onclick="selectAllRecips('speler')">Alle spelers</button>
        </div>
        ${spelerRecips.map(p=>`<div class="recip-row" data-id="${p.id}" data-cat="speler" onclick="togRecip(this)" style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid var(--bo);last-child:border-none;background:var(--su);transition:background .1s">
          <div style="width:18px;height:18px;border-radius:5px;border:2px solid var(--ac);background:var(--ac);display:flex;align-items:center;justify-content:center;flex-shrink:0"><i class="ti ti-check" style="font-size:11px;color:#fff"></i></div>
          ${av(p.name,'avsm')}
          <div style="flex:1"><div style="font-size:13px;font-weight:500">${p.name}</div><div style="font-size:11px;color:var(--t3)">${(p.posities||[]).join(', ')}</div></div>
          ${p.status?sPl(p.status):''}
        </div>`).join('')}
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;margin-bottom:4px">
        <span id="recip-count" style="font-size:12px;color:var(--t2)">${allRecips.length} van ${allRecips.length} geselecteerd</span>
        <div style="display:flex;gap:6px">
          <button class="bsm" onclick="selectAllRecips('all')" style="font-size:11px">Alles selecteren</button>
          <button class="bsm" onclick="selectAllRecips('none')" style="font-size:11px">Niets selecteren</button>
        </div>
      </div>
      <label style="margin-top:12px">Onderwerp</label>
      <input type="text" id="msubject" value="Re: ${t.naam} — ${fmtD(t.datum)}" placeholder="Onderwerp van het bericht">
      <label>Bericht</label>
      <textarea id="mtekst2" rows="4" placeholder="Typ je bericht aan de geselecteerde deelnemers…"></textarea>
      <div id="send-preview" style="margin-top:10px;font-size:12px;color:var(--t3)"></div>`;
    // update preview on textarea input
    setTimeout(()=>{
      document.getElementById('mtekst2')?.addEventListener('input',updateSendPreview);
      updateSendPreview();
    },50);
  }
  else if(mode==='log-add'){
    const sp=visSp();
    document.getElementById('mdtitle').textContent='Log entry toevoegen';
    document.getElementById('mdbody').innerHTML=`
      <label>Speler</label><select id="mspl">${sp.map(s=>`<option value="${s.id}">${s.name}</option>`).join('')}</select>
      <label>Titel</label><input type="text" id="mtit" placeholder="Korte omschrijving">
      <label>Type</label><select id="mtyp"><option value="training">Training</option><option value="blessure">Blessure</option><option value="aandacht">Aandacht</option><option value="voeding">Voeding</option></select>
      <label>Notitie</label><textarea id="mnot" placeholder="Details, observaties…"></textarea>`;
  }
  else if(mode==='nieuw-bericht'){
    document.getElementById('mdtitle').textContent='Nieuw bericht';
    const all=[...D.trainers,...D.begeleiders,...D.specialisten,...D.spelers];
    document.getElementById('mdbody').innerHTML=`<label>Aan</label><select id="maan">${all.map(p=>`<option${meta.aan&&meta.aan===p.name?' selected':''}>${p.name}</option>`).join('')}</select><label>Bericht</label><textarea id="mtekst" placeholder="Typ je bericht…"></textarea>`;
  }
  ov.classList.add('open');
}

function berichtTraining(id){
  const t=D.trainingen.find(x=>x.id===id);if(!t)return;
  openM('training-bericht',{training:t});
}

// Toggle a recipient row on/off
function togRecip(row){
  const isOn=row.querySelector('div').style.background!=='transparent'&&row.querySelector('div').style.background!=='';
  const chk=row.querySelector('div');
  if(isOn){
    chk.style.background='transparent';chk.style.borderColor='var(--b2)';
    chk.innerHTML='';row.style.opacity='0.45';
  } else {
    chk.style.background='var(--ac)';chk.style.borderColor='var(--ac)';
    chk.innerHTML='<i class="ti ti-check" style="font-size:11px;color:#fff"></i>';row.style.opacity='1';
  }
  updateRecipCount();updateSendPreview();
}

function selectAllRecips(cat){
  document.querySelectorAll('.recip-row').forEach(row=>{
    if(cat==='all'||cat==='none'||row.dataset.cat===cat){
      const chk=row.querySelector('div');
      const on=(cat!=='none');
      chk.style.background=on?'var(--ac)':'transparent';
      chk.style.borderColor=on?'var(--ac)':'var(--b2)';
      chk.innerHTML=on?'<i class="ti ti-check" style="font-size:11px;color:#fff"></i>':'';
      row.style.opacity=on?'1':'0.45';
    }
  });
  updateRecipCount();updateSendPreview();
}

function getSelectedRecips(){
  const sel=[];
  document.querySelectorAll('.recip-row').forEach(row=>{
    const chk=row.querySelector('div');
    if(chk.style.background==='var(--ac)'||chk.style.background.includes('91,227')||chk.innerHTML.includes('ti-check')){
      sel.push({id:parseInt(row.dataset.id),cat:row.dataset.cat});
    }
  });
  return sel;
}

function updateRecipCount(){
  const sel=getSelectedRecips();
  const total=document.querySelectorAll('.recip-row').length;
  const el=document.getElementById('recip-count');
  if(el)el.textContent=sel.length+' van '+total+' geselecteerd';
}

function updateSendPreview(){
  const sel=getSelectedRecips();
  const tekst=document.getElementById('mtekst2')?.value.trim();
  const prev=document.getElementById('send-preview');
  if(!prev)return;
  if(sel.length===0){prev.innerHTML='<span style="color:var(--rd)"><i class="ti ti-alert-circle" style="vertical-align:-2px;margin-right:4px"></i>Selecteer minstens één ontvanger.</span>';return;}
  if(!tekst){prev.innerHTML='';return;}
  const names=sel.map(r=>{
    if(r.cat==='trainer'){const t=byId(D.trainers,r.id);return t?t.name:'';}
    const s=byId(D.spelers,r.id);return s?s.name:'';
  }).filter(Boolean);
  prev.innerHTML=`<i class="ti ti-check-circle" style="color:var(--gn);vertical-align:-2px;margin-right:4px"></i>Bericht wordt verstuurd naar: <strong>${names.slice(0,4).join(', ')}${names.length>4?' en '+(names.length-4)+' anderen':''}</strong>`;
}

function verzendTrainingBericht(trainingId){
  const tekst=document.getElementById('mtekst2')?.value.trim();
  if(!tekst){toast('Typ eerst een bericht');return;}
  const sel=getSelectedRecips();
  if(!sel.length){toast('Selecteer minstens één ontvanger');return;}
  const subject=document.getElementById('msubject')?.value.trim();
  const sender=RUSERS[role].name;
  // Add to chatMsgs for each recipient (simulate sending)
  sel.forEach(r=>{
    const key=r.id;
    if(!chatMsgs[key])chatMsgs[key]=[];
    chatMsgs[key].push({van:sender,r:'uit',tekst:subject?`[${subject}] ${tekst}`:tekst,tijd:'nu'});
  });
  // Also add to D.berichten for unread counter
  sel.forEach(r=>{
    const recipName=r.cat==='trainer'?byId(D.trainers,r.id)?.name:byId(D.spelers,r.id)?.name;
    if(recipName){
      D.berichten.unshift({id:nid(D.berichten),van:RUSERS[role].id||99,vanNaam:sender,aan:r.id,aanNaam:recipName,tekst:tekst,tijd:'nu',gelezen:false});
    }
  });
  toast(`Bericht verstuurd naar ${sel.length} ${sel.length===1?'persoon':'personen'}!`);
  closeM();renderSB();
}

const togRep=()=>{document.getElementById('reprow').style.display=document.getElementById('mrep').checked?'block':'none';};
const mbgclose=e=>{if(e.target===document.getElementById('modal'))closeM();};
const closeM=()=>document.getElementById('modal').classList.remove('open');

function submitM(){
  const mode=mMode,meta=mMeta;
  if(mode==='speler-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul een naam in');return;}
    D.spelers.push({id:nid(D.spelers),name,woonplaats:document.getElementById('mw').value,geboortedatum:document.getElementById('md2').value,lidsoort:document.getElementById('mls').value,posities:posGet(),nineGrid:ngGet(),trainerIds:msGet('mtr'),begeleiderIds:msGet('mbg'),specialistIds:msGet('msp'),status:'actief',doelen:0,aanwezig:100,blessure:null});
    toast(name+' toegevoegd');
  }else if(mode==='speler-edit'){
    const s=D.spelers.find(p=>p.id===meta.id);if(!s)return;
    s.name=document.getElementById('mn').value.trim()||s.name;s.woonplaats=document.getElementById('mw').value;s.geboortedatum=document.getElementById('md2').value;
    s.lidsoort=document.getElementById('mls').value;s.posities=posGet();s.nineGrid=ngGet();
    s.trainerIds=msGet('mtr');s.begeleiderIds=msGet('mbg');s.specialistIds=msGet('msp');
    s.status=document.getElementById('mst').value;s.blessure=document.getElementById('mbl').value||null;
    toast(s.name+' opgeslagen');
  }else if(mode==='trainer-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    const c=avc(name);D.trainers.push({id:nid(D.trainers),name,spec:document.getElementById('mspec').value,avBg:c.bg,avTx:c.tx});toast(name+' toegevoegd');
  }else if(mode==='begel-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    D.begeleiders.push({id:nid(D.begeleiders),name,rol:document.getElementById('mrol').value});toast(name+' toegevoegd als begeleider');
  }else if(mode==='spec-add'){
    const name=document.getElementById('mn').value.trim();if(!name){toast('Vul naam in');return;}
    const c=avc(name);D.specialisten.push({id:nid(D.specialisten),name,rol:document.getElementById('mrol2').value,taak:document.getElementById('mtaak').value,email:document.getElementById('memail').value,tel:document.getElementById('mtel').value,avBg:c.bg,avTx:c.tx});toast(name+' toegevoegd als specialist');
  }else if(mode==='spec-edit'){
    const sp=byId(D.specialisten,meta.id);if(!sp)return;
    sp.name=document.getElementById('mn').value.trim()||sp.name;sp.rol=document.getElementById('mrol2').value;sp.taak=document.getElementById('mtaak').value;sp.email=document.getElementById('memail').value;sp.tel=document.getElementById('mtel').value;toast(sp.name+' opgeslagen');
  }else if(mode==='training-add'){
    const naam=document.getElementById('mnm').value.trim();if(!naam){toast('Vul een naam in');return;}
    const rep=document.getElementById('mrep').checked;
    D.trainingen.push({id:nid(D.trainingen),naam,type:document.getElementById('mty').value,datum:document.getElementById('mdt').value,tijd:document.getElementById('mtj').value,duur:parseInt(document.getElementById('mdr').value)||90,trainerIds:msGet('mtr2'),spelerIds:msGet('msp2'),notities:document.getElementById('mno').value,herhalend:rep,herhaling:rep?document.getElementById('mfrq').value:null});
    toast('Training gepland');
  }else if(mode==='training-edit'){
    const t=D.trainingen.find(x=>x.id===meta.id);if(!t)return;
    const rep=document.getElementById('mrep').checked;
    t.naam=document.getElementById('mnm').value.trim()||t.naam;t.type=document.getElementById('mty').value;t.datum=document.getElementById('mdt').value;t.tijd=document.getElementById('mtj').value;t.duur=parseInt(document.getElementById('mdr').value)||t.duur;t.notities=document.getElementById('mno').value;
    t.herhalend=rep;t.herhaling=rep?document.getElementById('mfrq').value:null;t.trainerIds=msGet('mtr2');t.spelerIds=msGet('msp2');
    toast('Training opgeslagen');
  }else if(mode==='training-bericht'){
    // handled by verzendTrainingBericht directly
    closeM();return;
  }else if(mode==='log-add'||mode==='log-add-speler'){
    const spId=mode==='log-add-speler'?parseInt(document.getElementById('mspl').value):parseInt(document.getElementById('mspl').value);
    const titel=document.getElementById('mtit').value.trim();if(!titel){toast('Vul een titel in');return;}
    D.logs.unshift({id:nid(D.logs),speler:spId,datum:new Date('2026-06-04').toISOString().slice(0,10),type:document.getElementById('mtyp').value,titel,nota:document.getElementById('mnot').value,auteur:RUSERS[role].name,auteurRol:role});
    toast('Log entry opgeslagen');
  }else if(mode==='nieuw-bericht'){
    const tekst=document.getElementById('mtekst')?.value.trim();if(!tekst){toast('Typ een bericht');return;}
    toast('Bericht verstuurd!');
  }
  closeM();renderPage();renderSB();
}

// ─── INIT ────────────────────────────────────────────
setRole('trainer');
</script>
